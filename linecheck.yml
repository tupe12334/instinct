# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

rules:
  - pattern: "skills/**/SKILL.md"
    warn: 200
    warn_message: "Skill getting long — consider splitting into a focused sub-skill"
    error: 400
    error_message: "Skill file too large to review easily; split it up"
  - pattern: "**/*.py"
    warn: 200
    warn_message: "Getting long — consider splitting into functions/modules"
    error: 400
    error_message: "File exceeds the hard limit — split before merging"
  - pattern: "**/*.md"
    warn: 200
    error: 400

exclude:
  - "README.md"
  - "assets/**"
  - ".claude-plugin/**"
  - ".codex-plugin/**"
